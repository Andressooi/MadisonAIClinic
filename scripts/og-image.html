<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{width:1200px;height:630px;background:#FBF8F3;color:#16130F;
  font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;overflow:hidden;
  display:flex;align-items:center;gap:64px;padding:0 72px;border-bottom:10px solid #A4372A}
.left{display:flex;flex-direction:column;gap:26px;width:640px}
.eyebrow{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:15px;letter-spacing:.2em;
  text-transform:uppercase;color:#A4372A}
h1{margin:0;font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:62px;line-height:1.04;letter-spacing:-.022em}
h1 em{font-style:italic}
p{margin:0;font-size:21px;line-height:1.5;color:#4E4639}
.mark{font-family:'Newsreader',Georgia,serif;font-size:24px;letter-spacing:-.01em;
  padding-top:22px;border-top:1px solid #E4DCCE;display:flex;gap:14px;align-items:baseline}
.mark span{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.16em;
  text-transform:uppercase;color:#6F6656}
.card{width:344px;background:#FFFDF9;border:1px solid #E4DCCE;padding:32px 30px;
  display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 60px -30px rgba(22,19,15,.3)}
.card .lbl{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:#6F6656}
.fig{display:flex;align-items:flex-end;gap:10px}
.fig b{font-size:78px;line-height:.88;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.fig i{font-style:normal;font-size:19px;color:#6F6656;padding-bottom:11px}
.bar{height:12px;background:#EFE6D8;border-radius:6px;overflow:hidden}
.bar i{display:block;width:32.5%;height:100%;background:#A4372A;border-radius:6px}
.card .note{font-size:15px;line-height:1.45;color:#6F6656}
</style></head><body>
<div class="left">
  <div class="eyebrow">Free · Madison &amp; Dane County</div>
  <h1>Your business has a score.<br><em>You've just never seen it.</em></h1>
  <p>A score out of ten, twenty-two findings, and the evidence under every one.</p>
  <div class="mark">Madison AI Clinic <span>Madison, WI</span></div>
</div>
<div class="card">
  <div class="lbl">Cold intent score</div>
  <div class="fig"><b>3.25</b><i>of 10</i></div>
  <div class="bar"><i></i></div>
  <div class="note">Sample. Northside Plumbing is a composite, not a client.</div>
</div>
</body></html>
